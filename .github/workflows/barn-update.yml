name: Barn House Chulkovo — обновление Суточно
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Обновить занятость
        env:
          BARN_ICS_URL: ${{ secrets.BARN_ICS_URL }}
        run: python update_barn_calendar.py
      - name: Сохранить JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add barn-busy-dates.json
          git diff --cached --quiet || (git commit -m 'Update Barn House calendar' && git push)
